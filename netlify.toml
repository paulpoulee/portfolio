# Configuration Netlify : site statique, aucune commande de build.
[build]
  publish = "."

# En-têtes de sécurité pour toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Polices : ne changent jamais, mises en cache un an
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images, vidéos et documents : mis en cache 30 jours
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/certificates/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Fichiers texte lus par les moteurs et les IA : accents corrects
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Fichiers du dépôt qui n'ont pas à être publics
[[redirects]]
  from = "/outils/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
